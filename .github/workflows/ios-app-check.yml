# Compiles the iOS app around ssrecomp's synthetic stand-in for the game code, to check the
# iOS changes in ios/ssrecomp-ios.patch. No ROM, game code or save is used or produced.
# Runs when the iOS files change on the iOS_version branch, or by hand (Actions tab > iOS app
# check > Run workflow, once this file is on the default branch).
name: iOS app check
on:
  workflow_dispatch:
  push:
    branches: [iOS_version]
    paths: ['ios/**', '.github/workflows/ios-app-check.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ssrecomp and apply the iOS changes
        run: |
          commit=$(sed -n 's/^SSRECOMP_COMMIT=//p' ios/build.sh)
          git clone https://github.com/ClickingMaster/ssrecomp.git "$RUNNER_TEMP/ssrecomp"
          git -C "$RUNNER_TEMP/ssrecomp" checkout --quiet "$commit"
          git -C "$RUNNER_TEMP/ssrecomp" apply "$GITHUB_WORKSPACE/ios/ssrecomp-ios.patch"
      - run: python -m pip install pyelftools "cmake>=3.24,<4" ninja
      - name: Synthetic game code
        working-directory: ${{ runner.temp }}/ssrecomp
        run: python tests/native_smoke.py --build-dir "$RUNNER_TEMP/smoke" --fixture-only
      - name: Configure for iOS
        run: |
          head -c 4096 /dev/zero > "$RUNNER_TEMP/placeholder.nds"
          sips -s format png /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns \
            --out "$RUNNER_TEMP/icon.png" >/dev/null
          sips -z 1024 1024 "$RUNNER_TEMP/icon.png" >/dev/null
          cmake -S "$RUNNER_TEMP/ssrecomp" -B "$RUNNER_TEMP/build-ios" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSSR_GENERATED_DIR="$RUNNER_TEMP/smoke/generated fixtures with spaces" \
            -DSSR_IOS_ROM="$RUNNER_TEMP/placeholder.nds" -DSSR_IOS_ICON="$RUNNER_TEMP/icon.png"
      - name: Build (unsigned)
        run: |
          xcodebuild -project "$RUNNER_TEMP/build-ios/ssrecomp.xcodeproj" -target ssrecomp \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app="$(find "$RUNNER_TEMP/build-ios" -maxdepth 3 -type d -name SoulSilver.app | head -n 1)"
          echo "$app"
          plutil -lint "$app/Info.plist"
          test -f "$app/Assets.car"
          plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$app/Info.plist"
